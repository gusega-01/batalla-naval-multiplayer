<script>
    const socket = io('https://batalla-naval-multiplayer-4zh3.onrender.com');
    let currentRoomCode = null;

    // Autounirse si entra desde un Link de invitación (?room=CODIGO)
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const roomFromUrl = urlParams.get('room');
        if (roomFromUrl) {
            document.getElementById('roomCodeInput').value = roomFromUrl;
            document.getElementById('consoleLog').innerText = `Uniéndose a la sala: ${roomFromUrl}...`;
            unirseASala();
        }
    });

    function crearSala() {
        socket.emit('room:create', { hostName: 'Jugador 1' });
    }

    function unirseASala() {
        const code = document.getElementById('roomCodeInput').value.trim();
        if (!code) return alert('Ingresá un código válido');
        socket.emit('room:join', { roomCode: code, playerName: 'Jugador 2' });
    }

    // 1. El Creador recibe la confirmación de sala creada
    socket.on('room:created', ({ roomCode }) => {
        currentRoomCode = roomCode;
        document.getElementById('setupMenu').style.display = 'none';
        
        // Mostrar tarjeta de invitación y QR
        const inviteUrl = `${window.location.origin}?room=${roomCode}`;
        document.getElementById('inviteLinkInput').value = inviteUrl;
        document.getElementById('qrCodeImg').src = `https://quickchart.io/qr?text=${encodeURIComponent(inviteUrl)}&size=200`;
        document.getElementById('inviteSection').style.display = 'block';
        document.getElementById('consoleLog').innerText = `Sala creada: ${roomCode}. Esperando rival...`;
    });

    // 2. El Invitado recibe la confirmación al unirse
    socket.on('room:joined', ({ roomCode }) => {
        currentRoomCode = roomCode;
        iniciarPantallaJuego();
        document.getElementById('consoleLog').innerText = `¡Te uniste a la sala ${roomCode}! Acomodá tu flota.`;
        switchBoard('myBoard');
    });

    // 3. El Creador detecta que el Rival ya entró (se oculta el QR y arranca la partida)
    socket.on('room:opponent_joined', ({ message }) => {
        iniciarPantallaJuego();
        document.getElementById('consoleLog').innerText = `¡El rival se ha conectado! Acomodá tu flota.`;
        switchBoard('myBoard');
    });

    function iniciarPantallaJuego() {
        document.getElementById('setupMenu').style.display = 'none';
        document.getElementById('inviteSection').style.display = 'none'; // Oculta el QR y el link
        document.getElementById('boardTabs').style.display = 'flex';     // Muestra las pestañas
    }

    function copiarLink() {
        const copyText = document.getElementById('inviteLinkInput');
        copyText.select();
        navigator.clipboard.writeText(copyText.value);
        alert('¡Link de invitación copiado!');
    }

    function switchBoard(tab) {
        const myBoard = document.getElementById('myBoardContainer');
        const enemyBoard = document.getElementById('enemyBoardContainer');
        const tabMy = document.getElementById('tabMyBoard');
        const tabEnemy = document.getElementById('tabEnemyBoard');

        if (tab === 'myBoard') {
            myBoard.classList.add('active');
            enemyBoard.classList.remove('active');
            tabMy.classList.add('active');
            tabEnemy.classList.remove('active');
        } else {
            enemyBoard.classList.add('active');
            myBoard.classList.remove('active');
            tabEnemy.classList.add('active');
            tabMy.classList.remove('active');
        }
    }
</script>
