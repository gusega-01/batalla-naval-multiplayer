<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Batalla Naval - Sincronizado en Vivo</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 { margin: 5px 0; font-size: 1.3rem; }

    .invite-card {
      background: #1e1e1e;
      border: 1px solid #333;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 10px;
      width: 100%;
      max-width: 480px;
    }

    .invite-card input {
      width: 80%;
      padding: 6px;
      background: #090d16;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 4px;
      text-align: center;
      margin-bottom: 6px;
    }

    .btn-primary {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }

    .btn-success {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }

    .turn-banner {
      background: #1e1b4b;
      border: 2px solid #6366f1;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      width: 100%;
      max-width: 480px;
      margin-bottom: 8px;
      color: #f1c40f;
    }

    .skills-panel {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 480px;
    }

    .energy-badge {
      background-color: #f39c12;
      color: #121212;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 13px;
    }

    .skill-btn {
      background-color: #2c3e50;
      color: white;
      border: 1px solid #34495e;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }

    .skill-btn.defensive { background-color: #16a085; border-color: #1abc9c; }
    .skill-btn.active { border-color: #f1c40f; background-color: #d35400; }

    .roulette-btn {
      background-color: #8e44ad;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }

    .roulette-btn:disabled { background-color: #555; cursor: not-allowed; }

    .target-badge {
      background-color: #2c3e50;
      color: #f1c40f;
      padding: 5px 10px;
      border-radius: 5px;
      font-weight: bold;
      font-size: 12px;
      border: 1px solid #f1c40f;
    }

    #consoleLog {
      background-color: #181818;
      border: 1px solid #282828;
      border-radius: 6px;
      padding: 8px;
      height: 65px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      color: #00ff66;
      margin-bottom: 8px;
      width: 100%;
      max-width: 480px;
      text-align: left;
    }

    .tab-bar {
      display: flex;
      gap: 4px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 6px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #aaa;
      font-size: 12px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active { background: #007bff; color: #fff; border-color: #0056b3; }
    .tab-btn.target-locked { border-color: #f1c40f; color: #f1c40f; }

    .board-container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 2px;
      background: #222;
      padding: 4px;
      border-radius: 8px;
      aspect-ratio: 1;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }

    .cell {
      background-color: #2a2a2a;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      user-select: none;
      cursor: pointer;
    }

    .cell.ship { background-color: #2980b9; }
    .cell.water { background-color: #3498db; color: white; }
    .cell.hit { background-color: #e74c3c; color: white; }
    .cell.shielded { border: 2px solid #1abc9c; }
  </style>
</head>
<body>

  <h1>🚢 Batalla Naval Táctica</h1>

  <!-- Menú Inicial -->
  <div id="setupMenu" class="invite-card">
    <h3 style="margin:2px 0;">Tu Apodo</h3>
    <input type="text" id="playerNameInput" placeholder="Ej: Gustavo" maxlength="12">
    <hr style="border-color:#333; margin:8px 0;">
    <button class="btn-primary" onclick="crearSala()">✨ Crear Nueva Sala</button>
    <br><br>
    <input type="text" id="roomCodeInput" placeholder="Código de Sala">
    <button class="btn-primary" style="background:#16a34a;" onclick="unirseASala()">Unirse a Sala</button>
  </div>

  <!-- Invitación QR -->
  <div id="inviteSection" class="invite-card" style="display: none;">
    <p style="margin:2px 0;"><b>¡Sala Creada!</b> Link de invitación:</p>
    <input type="text" id="inviteLinkInput" readonly>
    <button class="btn-primary" style="padding:4px;" onclick="copiarLink()">📋 Copiar Link</button>
    <br><br>
    <img id="qrCodeImg" src="" alt="QR" style="width: 110px; height: 110px; border-radius: 4px;">
    <hr style="border-color:#333; margin:6px 0;">
    <div id="playerCountText" style="font-weight:bold; font-size:12px; margin-bottom:4px;">Jugadores en sala: 1/4</div>
    <button class="btn-primary" style="background:#8b5cf6;" onclick="agregarBot()">🤖 Agregar Bot</button>
  </div>

  <!-- Cartel Indicador de Turno -->
  <div id="turnBanner" class="turn-banner" style="display: none;">
    🎲 Turno actual: <span id="activePlayerName">Cargando...</span>
  </div>

  <!-- Panel de Habilidades -->
  <div class="skills-panel" id="skillsPanel" style="display: none;">
    <div class="energy-badge">⚡ Energía: <span id="energyValue">3</span>/10</div>

    <button class="roulette-btn" id="btnRoulette" onclick="girarRuleta()">🎰 Girar Ruleta (0⚡)</button>
    <span class="target-badge" id="targetInfo">🎯 Objetivo: Pendiente</span>

    <button class="skill-btn active" id="btnShot" onclick="setSkill('basic_shot')">💥 Normal (0⚡)</button>
    <button class="skill-btn" id="btnCross" onclick="setSkill('cross_shot')">➕ Cruz (4⚡)</button>
    <button class="skill-btn" id="btnSonar" onclick="setSkill('sonar')">📡 Sonar (2⚡)</button>
    <button class="skill-btn" id="btnRain" onclick="setSkill('rain')">🌧️ Lluvia (6⚡)</button>

    <button class="skill-btn defensive" id="btnShield" onclick="setSkill('shield')">🛡️ Escudo (2⚡)</button>
    <button class="skill-btn defensive" id="btnMove" onclick="setSkill('move_ship')">⚓ Mover (2⚡)</button>
    <button class="skill-btn defensive" id="btnRepair" onclick="setSkill('repair')">🔧 Reparar (3⚡)</button>
  </div>

  <div id="consoleLog">Ingresá tu apodo para comenzar...</div>

  <div class="tab-bar" id="tabBar" style="display: none;"></div>

  <div class="board-container" id="boardContainer" style="display: none;">
    <div id="grid" class="grid"></div>
  </div>

  <script>
    const socket = io();
    let currentRoomCode = null;
    let myTurn = false;
    let activePlayerObj = null;

    let availableShips = [
      { id: 'carrier', name: 'Portaaviones', length: 4 },
      { id: 'battleship', name: 'Acorazado', length: 3 },
      { id: 'cruiser1', name: 'Crucero', length: 3 },
      { id: 'destroyer', name: 'Destructor', length: 2 },
      { id: 'patrol1', name: 'Lancha 1', length: 1 },
      { id: 'patrol2', name: 'Lancha 2', length: 1 }
    ];

    let myGrid = Array(10).fill(null).map(() => Array(10).fill(null));
    let boardHistories = {};
    let selectedSkill = 'basic_shot';
    let myEnergy = 3;
    let rouletteSpun = false;
    let currentTargetId = undefined;
    let isFreeChoice = false;
    let activeTabId = 'my';
    let enemyPlayers = [];

    function log(msg) {
      const el = document.getElementById('consoleLog');
      el.innerHTML += `<div>> ${msg}</div>`;
      el.scrollTop = el.scrollHeight;
    }

    function getPlayerName() {
      const name = document.getElementById('playerNameInput').value.trim();
      if (!name) { alert('Ingresá un apodo'); return null; }
      return name;
    }

    function crearSala() {
      const name = getPlayerName();
      if (!name) return;
      socket.emit('room:create', { hostName: name });
    }

    function unirseASala() {
      const name = getPlayerName();
      if (!name) return;
      const code = document.getElementById('roomCodeInput').value.trim();
      if (!code) return alert('Ingresá el código de sala');
      socket.emit('room:join', { roomCode: code, playerName: name });
    }

    function agregarBot() {
      socket.emit('room:add_bot', { roomCode: currentRoomCode });
    }

    socket.on('room:created', ({ roomCode }) => {
      currentRoomCode = roomCode;
      document.getElementById('setupMenu').style.display = 'none';
      const inviteUrl = `${window.location.origin}?room=${roomCode}`;
      document.getElementById('inviteLinkInput').value = inviteUrl;
      document.getElementById('qrCodeImg').src = `https://quickchart.io/qr?text=${encodeURIComponent(inviteUrl)}&size=200`;
      document.getElementById('inviteSection').style.display = 'block';
      log(`Sala ${roomCode} creada. Agregá bots o compartí el link.`);
    });

    socket.on('room:joined', ({ roomCode }) => {
      currentRoomCode = roomCode;
      document.getElementById('setupMenu').style.display = 'none';
      log(`Te uniste a la sala ${roomCode}. Esperando a los demás...`);
    });

    socket.on('room:player_update', ({ count, players }) => {
      document.getElementById('playerCountText').innerText = `Jugadores en sala: ${count}/4`;
      log(`Jugadores en la sala (${count}/4): ${players.map(p => p.name).join(', ')}`);
      enemyPlayers = players.filter(p => p.id !== socket.id);
    });

    socket.on('game:start', ({ activePlayer }) => {
      document.getElementById('inviteSection').style.display = 'none';
      document.getElementById('turnBanner').style.display = 'block';
      document.getElementById('skillsPanel').style.display = 'flex';
      document.getElementById('tabBar').style.display = 'flex';
      document.getElementById('boardContainer').style.display = 'block';

      // Flota auto-posicionada inicial
      ubicarBarcosDefault();
      actualizarTurno(activePlayer);
    });

    function ubicarBarcosDefault() {
      availableShips.forEach((s, idx) => {
        for (let i = 0; i < s.length; i++) {
          myGrid[idx * 1 + i][idx] = s.id;
        }
      });
    }

    function actualizarTurno(activePlayer) {
      activePlayerObj = activePlayer;
      myTurn = (activePlayer.id === socket.id);
      
      const turnEl = document.getElementById('activePlayerName');
      turnEl.innerText = myTurn ? '¡TU TURNO! 🎯' : activePlayer.name;

      document.getElementById('btnRoulette').disabled = !myTurn || rouletteSpun;

      if (!myTurn) {
        log(`⏳ Turno de <b>${activePlayer.name}</b>. Esperá tu turno.`);
      } else {
        log(`✨ <b>¡ES TU TURNO!</b> Girá la ruleta para atacar.`);
      }

      renderTabs();
      renderActiveBoard();
    }

    socket.on('game:turn_changed', ({ activePlayer }) => {
      rouletteSpun = false;
      currentTargetId = undefined;
      isFreeChoice = false;
      document.getElementById('targetInfo').innerText = '🎯 Objetivo: Pendiente';
      actualizarTurno(activePlayer);
    });

    function girarRuleta() {
      if (!myTurn || rouletteSpun) return alert('No es tu turno de girar la ruleta');
      socket.emit('game:spin_roulette', { roomCode: currentRoomCode });
    }

    socket.on('game:roulette_result', ({ targetId, isFreeChoice: free, targetName }) => {
      rouletteSpun = true;
      document.getElementById('btnRoulette').disabled = true;

      if (free) {
        isFreeChoice = true;
        document.getElementById('targetInfo').innerText = '🎯 Objetivo: ¡LIBRE!';
        log('🎰 ¡La ruleta cayó libre! Podés disparar a cualquier rival.');
      } else {
        currentTargetId = targetId;
        document.getElementById('targetInfo').innerText = `🎯 Objetivo: ${targetName}`;
        log(`🎰 Objetivo asignado: <b>${targetName}</b>`);
      }

      renderTabs();
    });

    socket.on('game:sync_board', ({ boardHistories: updatedHistories, lastAction }) => {
      boardHistories = updatedHistories;
      log(`💥 ${lastAction.player} atacó a ${lastAction.targetId === socket.id ? 'TU TABLERO' : 'un rival'} (${lastAction.isHit ? 'IMPACTO' : 'AGUA'})`);
      renderActiveBoard();
    });

    socket.on('error:msg', ({ message }) => {
      alert(message);
    });

    function renderTabs() {
      const tabBar = document.getElementById('tabBar');
      tabBar.innerHTML = '';

      const myBtn = document.createElement('button');
      myBtn.className = 'tab-btn' + (activeTabId === 'my' ? ' active' : '');
      myBtn.innerText = '🛡️ Mi Flota';
      myBtn.onclick = () => { activeTabId = 'my'; renderTabs(); renderActiveBoard(); };
      tabBar.appendChild(myBtn);

      enemyPlayers.forEach(p => {
        if (!boardHistories[p.id]) boardHistories[p.id] = {};
        const isLockedTarget = myTurn && (isFreeChoice || currentTargetId === p.id);

        const btn = document.createElement('button');
        btn.className = 'tab-btn' + (activeTabId === p.id ? ' active' : '') + (isLockedTarget ? ' target-locked' : '');
        btn.innerText = `${p.name} ${isLockedTarget ? '🎯' : ''}`;
        btn.onclick = () => { activeTabId = p.id; renderTabs(); renderActiveBoard(); };
        tabBar.appendChild(btn);
      });
    }

    function renderActiveBoard() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      if (!boardHistories[activeTabId]) boardHistories[activeTabId] = {};

      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 10; c++) {
          const key = `${r}_${c}`;
          const cell = document.createElement('div');
          cell.className = 'cell';

          if (activeTabId === 'my') {
            if (myGrid[r][c] !== null) {
              cell.classList.add('ship');
              cell.innerText = '🚢';
            }
            const state = boardHistories[socket.id] ? boardHistories[socket.id][key] : null;
            if (state) {
              cell.classList.add(state);
              if (state === 'hit') cell.innerText = '💥';
              if (state === 'water') cell.innerText = '•';
            }
          } else {
            const state = boardHistories[activeTabId][key];
            if (state) {
              cell.classList.add(state);
              if (state === 'hit') cell.innerText = '💥';
              if (state === 'water') cell.innerText = '•';
            }
            cell.onclick = () => dispararRival(r, c);
          }

          grid.appendChild(cell);
        }
      }
    }

    function dispararRival(r, c) {
      if (!myTurn) return alert('¡Esperá tu turno para disparar!');
      if (!rouletteSpun) return alert('¡Primero girá la ruleta!');

      if (!isFreeChoice && activeTabId !== currentTargetId) {
        return alert(`¡Pestaña bloqueada! Tenés que dispararle a tu objetivo de la ruleta.`);
      }

      const isHit = Math.random() < 0.7;

      socket.emit('game:action', {
        roomCode: currentRoomCode,
        targetId: activeTabId,
        row: r,
        col: c,
        type: selectedSkill,
        isHit
      });
    }

    function copiarLink() {
      const copyText = document.getElementById('inviteLinkInput');
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert('¡Link de invitación copiado!');
    }
  </script>
</body>
</html>
