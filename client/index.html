<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8">
    <title>Batalla Naval Táctica - 4 Jugadores</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin: 3px 0; font-size: 1.2rem; }

        .invite-card {
            background: #151e33;
            border: 1px solid #1e293b;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 8px;
            width: 100%;
            max-width: 480px;
        }

        .invite-card input {
            width: 80%;
            padding: 6px;
            background: #090d16;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 4px;
            text-align: center;
            margin-bottom: 6px;
        }

        .btn-copy {
            padding: 5px 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .game-bar {
            background: #111827;
            border: 1px solid #1f2937;
            padding: 6px;
            border-radius: 6px;
            width: 100%;
            max-width: 480px;
            margin-bottom: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
        }

        .status-badge {
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .action-btn {
            padding: 4px 6px;
            border: 1px solid #374151;
            background: #1f2937;
            color: #e5e7eb;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            font-weight: bold;
        }

        .action-btn.active {
            background: #2563eb;
            border-color: #3b82f6;
        }

        .console-box {
            background: #040711;
            border: 1px solid #1e293b;
            padding: 6px;
            border-radius: 6px;
            font-family: monospace;
            width: 100%;
            max-width: 480px;
            font-size: 0.7rem;
            color: #10b981;
            height: 60px;
            overflow-y: auto;
            margin-bottom: 6px;
            text-align: left;
        }

        .tab-bar {
            display: flex;
            gap: 3px;
            width: 100%;
            max-width: 480px;
            margin-bottom: 6px;
        }

        .tab-btn {
            flex: 1;
            padding: 6px;
            border: 1px solid #1e293b;
            background: #151e33;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: #2563eb;
            color: #fff;
            border-color: #3b82f6;
        }

        .board-container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            background: #1e293b;
            padding: 3px;
            border-radius: 8px;
            aspect-ratio: 1;
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
        }

        .cell {
            background: #0b0f19;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
            user-select: none;
            position: relative;
        }

        .cell:hover { background: #1e293b; }
        .cell.ship { background: #1d4ed8; }
        .cell.hit { background: #b91c1c; }
        .cell.miss { background: #374151; }
        .cell.shield { border: 2px solid #3b82f6; }
    </style>
</head>
<body>

    <h1>🚢 Batalla Naval - Multijugador</h1>

    <!-- Setup Nick -->
    <div id="setupMenu" class="invite-card">
        <h3 style="margin:2px 0;">Ingresá tu Apodo</h3>
        <input type="text" id="playerNameInput" placeholder="Apodo" maxlength="12">
        <hr style="border-color:#1e293b; margin:8px 0;">
        <button class="btn-copy" style="background:#16a34a; width:100%; padding:8px;" onclick="crearSala()">✨ Crear Nueva Sala</button>
        <br><br>
        <input type="text" id="roomCodeInput" placeholder="Código">
        <button class="btn-copy" style="width:100%;" onclick="unirseASala()">Unirse</button>
    </div>

    <!-- Invitación QR / Bots -->
    <div id="inviteSection" class="invite-card" style="display: none;">
        <p style="margin:2px 0;"><b>¡Sala Creada!</b> Link de invitación:</p>
        <input type="text" id="inviteLinkInput" readonly>
        <button class="btn-copy" onclick="copiarLink()">📋 Copiar Link</button>
        <br><br>
        <img id="qrCodeImg" src="" alt="QR" style="width: 100px; height: 100px; border-radius: 4px;">
        <hr style="border-color:#1e293b; margin:6px 0;">
        <div id="playerCountText" style="font-weight:bold; font-size:0.8rem; margin-bottom:4px;">Jugadores en sala: 1/4</div>
        <button class="btn-copy" style="background:#8b5cf6; width:100%;" onclick="agregarBot()">🤖 Agregar Bot</button>
    </div>

    <!-- FASE DE COLOCACIÓN DE BARCOS -->
    <div id="placementSection" class="invite-card" style="display: none;">
        <h3 style="margin:0 0 5px 0;">Acomodá tus Barcos</h3>
        <button class="btn-copy" style="background:#0284c7; width:100%; margin-bottom:5px;" onclick="ubicarBarcosAleatorio()">🎲 Ubicación Aleatoria</button>
        <button class="btn-copy" style="background:#16a34a; width:100%;" onclick="confirmarBarcos()">✅ Listo para Jugar</button>
    </div>

    <!-- BARRA TÁCTICA -->
    <div id="gameBar" class="game-bar" style="display: none;">
        <div class="status-badge" style="background: #eab308; color:#000;">⚡ Energía: <span id="energyVal">10</span>/10</div>
        <button class="action-btn" style="background:#2563eb;" onclick="girarRuleta()">🎯 Girar Ruleta</button>
        <div class="status-badge" style="background: #1e1b4b; color:#818cf8;" id="objectiveBadge">Objetivo: ¡LIBRE!</div>
        
        <button class="action-btn active" id="btn-simple" onclick="setAtaque('simple', 0)">💥 Disparo (0⚡)</button>
        <button class="action-btn" id="btn-cruz" onclick="setAtaque('cruz', 4)">🎯 Cruz (4⚡)</button>
        <button class="action-btn" id="btn-sonar" onclick="setAtaque('sonar', 2)">📡 Sonar (2⚡)</button>
        <button class="action-btn" id="btn-lluvia" onclick="setAtaque('lluvia', 6)">🚀 Lluvia (6⚡)</button>
        <button class="action-btn" id="btn-escudo" onclick="setAtaque('escudo', 2)">🛡️ Escudo (2⚡)</button>
        <button class="action-btn" id="btn-mover" onclick="setAtaque('mover', 2)">⚓ Mover (2⚡)</button>
        <button class="action-btn" id="btn-reparar" onclick="setAtaque('reparar', 3)">🛠️ Reparar (3⚡)</button>
    </div>

    <div id="consoleLog" class="console-box">Ingresá tu apodo para empezar...</div>

    <div class="tab-bar" id="tabBar" style="display: none;"></div>

    <div id="boardContainer" class="board-container" style="display: none;">
        <div id="grid" class="grid"></div>
    </div>

    <script>
        const socket = io('https://batalla-naval-multiplayer-4zh3.onrender.com');
        let currentRoomCode = null;
        let activeTabId = 'my';
        let enemyPlayers = [];
        let myEnergy = 10;
        let selectedAtaque = 'simple';
        let ataqueCosto = 0;

        // Historial persistente por pestaña
        const boardHistories = { my: {} };

        function appendLog(text) {
            const consoleBox = document.getElementById('consoleLog');
            consoleBox.innerHTML += `<div>> ${text}</div>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function initGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            
            if (!boardHistories[activeTabId]) {
                boardHistories[activeTabId] = {};
            }

            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 10; c++) {
                    const key = `${r}_${c}`;
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    // Restaurar estado guardado
                    const state = boardHistories[activeTabId][key];
                    if (state) cell.classList.add(state);

                    cell.onclick = () => onCellClick(r, c, cell);
                    gridEl.appendChild(cell);
                }
            }
        }

        function ubicarBarcosAleatorio() {
            boardHistories['my'] = {};
            // Ubicamos barcos de muestra en el tablero propio
            const sampleShips = ['0_0','0_1','0_2','2_2','3_2','4_2','6_5','6_6','6_7','6_8','9_1','9_2'];
            sampleShips.forEach(key => {
                boardHistories['my'][key] = 'ship';
            });
            initGrid();
            appendLog('🚢 Flota ubicada aleatoriamente.');
        }

        function confirmarBarcos() {
            document.getElementById('placementSection').style.display = 'none';
            socket.emit('game:ready', { roomCode: currentRoomCode });
            appendLog('✅ Flota lista. ¡Esperando a los rivales!');
        }

        function renderTabs(players) {
            const tabBar = document.getElementById('tabBar');
            tabBar.innerHTML = '';

            const myBtn = document.createElement('button');
            myBtn.className = 'tab-btn' + (activeTabId === 'my' ? ' active' : '');
            myBtn.innerText = '🛡️ Mi Flota';
            myBtn.onclick = () => {
                activeTabId = 'my';
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                myBtn.classList.add('active');
                initGrid();
            };
            tabBar.appendChild(myBtn);

            enemyPlayers = players.filter(p => p.id !== socket.id);
            enemyPlayers.forEach(p => {
                if (!boardHistories[p.id]) boardHistories[p.id] = {};
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (activeTabId === p.id ? ' active' : '');
                btn.innerText = `${p.isBot ? '🤖' : '👤'} ${p.name}`;
                btn.onclick = () => {
                    activeTabId = p.id;
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    initGrid();
                };
                tabBar.appendChild(btn);
            });
        }

        function setAtaque(tipo, costo) {
            selectedAtaque = tipo;
            ataqueCosto = costo;
            document.querySelectorAll('.action-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById(`btn-${tipo}`);
            if (btn) btn.classList.add('active');
            appendLog(`Habilidad seleccionada: ${tipo.toUpperCase()} (${costo}⚡)`);
        }

        function girarRuleta() {
            if (myEnergy < 2) return alert('⚡ Energía insuficiente (requiere 2⚡)');
            myEnergy -= 2;
            document.getElementById('energyVal').innerText = myEnergy;
            appendLog('🎲 Girando ruleta...');
            socket.emit('game:spin_roulette', { roomCode: currentRoomCode });
        }

        socket.on('game:roulette_result', ({ message, targetName }) => {
            appendLog(message);
            document.getElementById('objectiveBadge').innerText = `Objetivo: ${targetName.toUpperCase()}`;
        });

        function onCellClick(row, col, cellEl) {
            const key = `${row}_${col}`;

            if (activeTabId === 'my') {
                if (['escudo', 'reparar', 'mover'].includes(selectedAtaque)) {
                    if (myEnergy < ataqueCosto) return alert('⚡ Energía insuficiente');
                    myEnergy -= ataqueCosto;
                    document.getElementById('energyVal').innerText = myEnergy;
                    
                    const cls = selectedAtaque === 'escudo' ? 'shield' : 'miss';
                    cellEl.classList.add(cls);
                    boardHistories['my'][key] = cls;
                    
                    appendLog(`Aplicado ${selectedAtaque.toUpperCase()} en (${row},${col})`);
                    setAtaque('simple', 0);
                } else {
                    alert('En tu flota solo podés aplicar defensas (Escudo/Reparación/Mover)');
                }
                return;
            }

            // Ataque a un rival (El disparo SIMPLE NO consume energía)
            if (selectedAtaque !== 'simple') {
                if (myEnergy < ataqueCosto) return alert('⚡ Energía insuficiente');
                myEnergy -= ataqueCosto;
                document.getElementById('energyVal').innerText = myEnergy;
            }

            cellEl.classList.add('hit');
            boardHistories[activeTabId][key] = 'hit'; // Persistir disparo en la pestaña del rival

            appendLog(`Disparo ${selectedAtaque.toUpperCase()} a ${activeTabId} en (${row},${col})`);
            socket.emit('game:action', { 
                roomCode: currentRoomCode, 
                targetId: activeTabId, 
                row, 
                col, 
                type: selectedAtaque 
            });

            setAtaque('simple', 0);
        }

        function crearSala() {
            const name = document.getElementById('playerNameInput').value.trim();
            if (!name) return alert('Por favor ingresá tu apodo');
            socket.emit('room:create', { hostName: name });
        }

        function unirseASala() {
            const name = document.getElementById('playerNameInput').value.trim();
            if (!name) return alert('Por favor ingresá tu apodo');
            const code = document.getElementById('roomCodeInput').value.trim();
            if (!code) return alert('Ingresá un código');
            socket.emit('room:join', { roomCode: code, playerName: name });
        }

        function agregarBot() {
            socket.emit('room:add_bot', { roomCode: currentRoomCode });
        }

        socket.on('room:created', ({ roomCode }) => {
            currentRoomCode = roomCode;
            document.getElementById('setupMenu').style.display = 'none';
            const inviteUrl = `${window.location.origin}?room=${roomCode}`;
            document.getElementById('inviteLinkInput').value = inviteUrl;
            document.getElementById('qrCodeImg').src = `https://quickchart.io/qr?text=${encodeURIComponent(inviteUrl)}&size=200`;
            document.getElementById('inviteSection').style.display = 'block';
            appendLog(`Sala ${roomCode} creada. Agregá bots o compartí el link.`);
        });

        socket.on('room:joined', ({ roomCode }) => {
            currentRoomCode = roomCode;
            document.getElementById('setupMenu').style.display = 'none';
            appendLog(`Te uniste a la sala ${roomCode}. Esperando completar...`);
        });

        socket.on('room:player_update', ({ count, players }) => {
            document.getElementById('playerCountText').innerText = `Jugadores en sala: ${count}/4`;
            appendLog(`Jugadores (${count}/4): ${players.map(p => p.name).join(', ')}`);
            renderTabs(players);
            if (count === 4) iniciarFaseColocacion();
        });

        function iniciarFaseColocacion() {
            document.getElementById('setupMenu').style.display = 'none';
            document.getElementById('inviteSection').style.display = 'none';
            document.getElementById('placementSection').style.display = 'block';
            document.getElementById('tabBar').style.display = 'flex';
            document.getElementById('boardContainer').style.display = 'block';
            ubicarBarcosAleatorio();
        }

        socket.on('game:start', () => {
            document.getElementById('placementSection').style.display = 'none';
            document.getElementById('gameBar').style.display = 'flex';
            appendLog('¡La batalla naval táctica de 4 jugadores ha comenzado!');
        });

        function copiarLink() {
            const copyText = document.getElementById('inviteLinkInput');
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert('¡Link de invitación copiado!');
        }
    </script>
</body>
</html>
