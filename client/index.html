<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Batalla Naval Táctica</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      background-color: #090d16;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .game-layout-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: url('assets/war-bg.jpg') no-repeat center top;
      background-size: 100% auto;
      padding-top: 110px;
      padding-bottom: 20px;
      padding-left: 10px;
      padding-right: 10px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
      box-sizing: border-box;
    }

    .invite-card, .skills-panel {
      background: rgba(15, 23, 42, 0.88) !important;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 8px;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
    }

    .invite-card input {
      width: 80%;
      padding: 8px;
      background: rgba(9, 13, 22, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 6px;
      text-align: center;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .btn-primary, .btn-success {
      border: none;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: transform 0.1s ease;
    }

    .btn-primary { background-color: #007bff; color: white; }
    .btn-success { background-color: #28a745; color: white; }

    .ship-selector {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .draggable-ship {
      background-color: rgba(30, 41, 59, 0.9);
      color: white;
      border: 2px dashed #f1c40f;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      font-weight: bold;
    }

    .draggable-ship.selected { background-color: #0284c7; border-style: solid; }
    .draggable-ship.placed { opacity: 0.4; cursor: not-allowed; border-style: solid; border-color: #334155; }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 4px #f1c40f; transform: scale(1); }
      50% { box-shadow: 0 0 16px #f1c40f; transform: scale(1.03); }
      100% { box-shadow: 0 0 4px #f1c40f; transform: scale(1); }
    }

    @keyframes pulseTab {
      0% { border-color: #f1c40f; color: #f1c40f; }
      50% { border-color: #38bdf8; color: #38bdf8; }
      100% { border-color: #f1c40f; color: #f1c40f; }
    }

    .skills-panel {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .energy-badge {
      background-color: #f39c12;
      color: #121212;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 13px;
    }

    .skill-btn {
      background-color: rgba(30, 41, 59, 0.9);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }

    .skill-btn.defensive { background-color: rgba(15, 118, 110, 0.9); border-color: #14b8a6; }
    .skill-btn.active { border-color: #f1c40f; background-color: #ea580c; }

    .roulette-btn {
      background-color: #7e22ce;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }

    .roulette-btn.pulse-roulette {
      animation: pulseGlow 1s infinite ease-in-out;
      background-color: #a855f7;
    }

    .roulette-btn:disabled { background-color: rgba(71, 85, 105, 0.8); cursor: not-allowed; animation: none; }

    .target-badge {
      background-color: rgba(30, 41, 59, 0.9);
      color: #f1c40f;
      padding: 5px 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      border: 1px solid #f1c40f;
    }

    #consoleLog {
      background-color: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 8px;
      height: 60px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      color: #4ade80;
      margin-bottom: 8px;
      width: 100%;
      text-align: left;
      box-sizing: border-box;
      backdrop-filter: blur(4px);
    }

    .tab-bar {
      display: flex;
      gap: 4px;
      width: 100%;
      margin-bottom: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(15, 23, 42, 0.88);
      color: #94a3b8;
      font-size: 12px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; }
    .tab-btn.target-locked { animation: pulseTab 1s infinite ease-in-out; }

    .tactical-board-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      margin: 0 auto;
      background: url('assets/board-frame.png') no-repeat center center;
      background-size: 100% 100%;
      box-shadow: 0 12px 32px rgba(0,0,0,0.8);
      border-radius: 8px;
      overflow: hidden;
    }

    .board-container {
      width: 100%;
      text-align: center;
    }

    .grid {
      position: absolute;
      top: 9.2%;
      left: 9.2%;
      width: 81.6%;
      height: 81.6%;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: 0;
      z-index: 10;
    }

    .ships-layer {
      position: absolute;
      top: 9.2%;
      left: 9.2%;
      width: 81.6%;
      height: 81.6%;
      pointer-events: none;
      z-index: 15;
    }

    .rendered-ship-entity {
      position: absolute;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      transition: all 0.2s ease;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.7));
      pointer-events: auto;
    }

    .rendered-ship-entity.draggable-ship-game {
      cursor: grab;
    }

    .rendered-ship-entity.dragging {
      opacity: 0.5;
      cursor: grabbing;
    }

    .cell {
      background-color: transparent;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      cursor: pointer;
      position: relative;
      z-index: 20;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }

    .cell.drag-over {
      background-color: rgba(56, 189, 248, 0.4) !important;
      border: 2px dashed #38bdf8 !important;
    }

    .cell.ship {
      background-color: rgba(2, 132, 199, 0.45);
      border: 1px solid #38bdf8;
    }

    .cell.hit {
      background-image: url('assets/explosion.png'), url('assets/explosion.jpg');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }

    .cell.water {
      background-image: url('assets/water-splash.png'), url('assets/water-splash.jpg');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }

    .cell.sunk {
      background-color: rgba(220, 38, 38, 0.5);
      background-image: url('assets/calavera.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }

    .cell.sonar { background-color: rgba(245, 158, 11, 0.6); }
    .cell.shielded { border: 2px solid #10b981; }

    .missile-projectile {
      position: fixed;
      width: 38px;
      height: 95px;
      z-index: 2147483647;
      pointer-events: none;
      will-change: transform, opacity;
      filter: drop-shadow(0 0 14px rgba(255, 120, 0, 0.95));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .impact-fx {
      position: fixed;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff7ae 0%, #ff9d00 45%, rgba(255, 60, 0, 0) 70%);
      z-index: 2147483647;
      pointer-events: none;
    }

    .turn-popup-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .turn-popup-overlay.show {
      opacity: 1;
      transform: scale(1);
    }

    .turn-popup-container img {
      max-width: 85vw;
      max-height: 25vh;
      display: block;
    }

    .winner-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999999;
      padding: 20px;
    }

    .winner-modal img {
      max-width: 90%;
      max-height: 50vh;
      object-fit: contain;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="game-layout-container">

    <!-- Menú Inicial -->
    <div id="setupMenu" class="invite-card">
      <h3 style="margin:2px 0; color: #f1c40f;">Tu Apodo de Capitán</h3>
      <input type="text" id="playerNameInput" placeholder="Ej: Gustavo" maxlength="12">
      <hr style="border-color:rgba(255,255,255,0.1); margin:12px 0;">
      <button type="button" class="btn-primary" onclick="crearSala()">✨ Crear Nueva Sala</button>
      <br><br>
      <input type="text" id="roomCodeInput" placeholder="Código de Sala">
      <button type="button" class="btn-primary" style="background:#16a34a;" onclick="unirseASala()">Unirse a Sala</button>
    </div>

    <!-- Invitación QR -->
    <div id="inviteSection" class="invite-card" style="display: none;">
      <p style="margin:2px 0;"><b>¡Sala Creada!</b> Link de invitación:</p>
      <input type="text" id="inviteLinkInput" readonly>
      <button class="btn-primary" style="padding:6px;" onclick="copiarLink()">📋 Copiar Link</button>
      <br><br>
      <img id="qrCodeImg" src="" alt="QR" style="width: 120px; height: 120px; border-radius: 8px;">
      <hr style="border-color:rgba(255,255,255,0.1); margin:10px 0;">
      <div id="playerCountText" style="font-weight:bold; font-size:13px; margin-bottom:6px;">Jugadores en sala: 1/4</div>
      <button class="btn-primary" style="background:#8b5cf6;" onclick="agregarBot()">🤖 Agregar Bot (Completar)</button>
    </div>

    <!-- Fase de Colocación -->
    <div class="invite-card" id="placementPanel" style="display: none;">
      <h3 style="margin: 0 0 6px 0;">🛠️ Posicioná tus 8 Barcos</h3>
      <div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 6px;">
        <button class="skill-btn" id="btnToggleRotate" onclick="toggleOrientation()">🔄 Horizontal</button>
        <button class="skill-btn" style="background:#0284c7;" onclick="ubicarBarcosAleatorios()">🎲 Aleatorio</button>
        <button class="skill-btn" style="background-color: #dc2626;" onclick="resetPlacement()">🔄 Limpiar</button>
      </div>

      <div class="ship-selector" id="shipSelector"></div>

      <div style="margin-top: 10px;">
        <button class="btn-success" id="btnConfirmFleet" onclick="confirmarFlota()" disabled>✅ Confirmar Flota e Iniciar</button>
      </div>
    </div>

    <!-- Panel de Habilidades -->
    <div class="skills-panel" id="skillsPanel" style="display: none;">
      <div class="energy-badge">⚡ Energía: <span id="energyValue">3</span>/10</div>

      <button class="roulette-btn" id="btnRoulette" onclick="girarRuleta()">🎰 Girar Ruleta (0⚡)</button>
      <span class="target-badge" id="targetInfo">🎯 Objetivo: Pendiente</span>

      <button class="skill-btn active" id="btnShot" onclick="setSkill('basic_shot')">💥 Normal (0⚡)</button>
      <button class="skill-btn" id="btnCross" onclick="setSkill('cross_shot')">➕ Cruz (4⚡)</button>
      <button class="skill-btn" id="btnSonar" onclick="setSkill('sonar')">📡 Sonar (2⚡)</button>
      <button class="skill-btn" id="btnRain" onclick="setSkill('rain')">🌧️ Lluvia (6⚡)</button>

      <button class="skill-btn defensive" id="btnShield" onclick="setSkill('shield')">🛡️ Escudo (2⚡)</button>
      <button class="skill-btn defensive" id="btnMove" onclick="setSkill('move_ship')">⚓ Mover (2⚡)</button>
      <button class="skill-btn defensive" id="btnRepair" onclick="setSkill('repair')">🔧 Reparar (3⚡)</button>
    </div>

    <!-- CAJA DE CHICANAS / TAUNT CHAT CON OPCIONES DE VOZ -->
    <div id="tauntContainer" class="invite-card" style="display: none; padding: 10px; flex-direction: column; gap: 8px;">
      <div style="display: flex; gap: 6px; width: 100%;">
        <input 
          type="text" 
          id="tauntInput" 
          maxlength="40" 
          placeholder="Chicana corta (máx 40)..." 
          style="flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(15, 23, 42, 0.9); color: #fff; font-size: 13px; outline: none;"
        />
        <button id="btnSendTaunt" onclick="sendTaunt()" style="padding: 8px 16px; background: #e11d48; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
          Enviar 🗣️
        </button>
      </div>

      <!-- SELECTORES DE VOZ Y ACENTO -->
      <div style="display: flex; gap: 6px; justify-content: space-between; width: 100%; font-size: 12px;">
        <select id="tauntGender" style="background: rgba(9,13,22,0.8); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 4px; flex: 1;">
          <option value="male">👨 Voz Masculina</option>
          <option value="female">👩 Voz Femenina</option>
        </select>

        <select id="tauntMode" style="background: rgba(9,13,22,0.8); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 4px; flex: 1;">
          <option value="es">🇦🇷 Español Natural</option>
          <option value="repo">🤖 Efecto Repo (Gringo)</option>
        </select>
      </div>
    </div>

    <div id="consoleLog">Ingresá tu apodo para comenzar...</div>

    <div class="tab-bar" id="tabBar" style="display: none;"></div>

    <!-- TABLERO TÁCTICO CON CAPAS -->
    <div class="board-container" id="boardContainer" style="display: none;">
      <div class="tactical-board-wrapper">
        <div id="shipsLayer" class="ships-layer"></div>
        <div id="grid" class="grid"></div>
      </div>
    </div>

  </div>

  <div id="turnPopup" class="turn-popup-overlay">
    <div class="turn-popup-container">
      <img id="turnPopupImg" src="assets/turno.png" alt="Turno">
    </div>
  </div>

  <div id="winnerModal" class="winner-modal" style="display: none;">
    <img id="endGameImg" src="" alt="Resultado">
    <button class="btn-primary" style="width: auto; padding: 12px 24px; font-size: 16px;" onclick="window.location.reload()">🔄 Jugar Otra Partida</button>
  </div>

  <script>
    const socket = io();
    let currentRoomCode = null;
    let myTurn = false;
    let activePlayerObj = null;
    let selectedSetupShipId = null;

    const availableShips = [
      { id: 'carrier', name: 'Portaaviones 🛳️', length: 4, img: 'assets/carrier.png' },
      { id: 'battleship1', name: 'Acorazado A 🚢', length: 3, img: 'assets/battleship.png' },
      { id: 'battleship2', name: 'Acorazado B 🚢', length: 3, img: 'assets/battleship.png' },
      { id: 'cruiser1', name: 'Crucero 1 🚤', length: 2, img: 'assets/cruiser.png' },
      { id: 'cruiser2', name: 'Crucero 2 🚤', length: 2, img: 'assets/cruiser.png' },
      { id: 'patrol1', name: 'Lancha 1 🛥️', length: 1, img: 'assets/patrol.png' },
      { id: 'patrol2', name: 'Lancha 2 🛥️', length: 1, img: 'assets/patrol.png' },
      { id: 'patrol3', name: 'Lancha 3 🛥️', length: 1, img: 'assets/patrol.png' }
    ];

    let isHorizontal = true;
    let placedShips = [];
    let myGrid = Array(10).fill(null).map(() => Array(10).fill(null));

    let boardHistories = {};
    let selectedSkill = 'basic_shot';
    let myEnergy = 3;
    let rouletteSpun = false;
    let currentTargetId = undefined;
    let isFreeChoice = false;
    let activeTabId = 'my';
    let enemyPlayers = [];
    let showMyShips = true;

    let shipToMove = null;
    let turnPopupTimer = null;

    const MISSILE_SRC = 'assets/missile.png';
    const MISSILE_NOSE_DEG = 0;
    let disparoEnCurso = false;

    function log(msg) {
      const el = document.getElementById('consoleLog');
      if (el) {
        el.innerHTML += `<div>> ${msg}</div>`;
        el.scrollTop = el.scrollHeight;
      }
    }

    function toggleOrientation() {
      isHorizontal = !isHorizontal;
      document.getElementById('btnToggleRotate').innerText = `🔄 ${isHorizontal ? 'Horizontal' : 'Vertical'}`;
    }

    function toggleShowShips() {
      showMyShips = !showMyShips;
      log(showMyShips ? '👁️ Barcos visibles.' : '🙈 Barcos ocultos.');
      renderTabs();
      renderActiveBoard();
    }

    function getPlayerName() {
      const nameInput = document.getElementById('playerNameInput');
      const name = nameInput ? nameInput.value.trim() : '';
      if (!name) { 
        alert('⚠️ Por favor, ingresá un apodo de capitán.'); 
        return null; 
      }
      return name;
    }

    function crearSala() {
      const name = getPlayerName();
      if (!name) return;
      log(`Creando sala para ${name}...`);
      socket.emit('room:create', { hostName: name });
    }

    function unirseASala() {
      const name = getPlayerName();
      if (!name) return;
      const codeInput = document.getElementById('roomCodeInput');
      const code = codeInput ? codeInput.value.trim() : '';
      if (!code) {
        alert('⚠️ Ingresá el código de la sala.');
        return;
      }
      log(`Uniéndose a la sala ${code}...`);
      socket.emit('room:join', { roomCode: code, playerName: name });
    }

    function agregarBot() {
      socket.emit('room:add_bot', { roomCode: currentRoomCode });
    }

    socket.on('room:created', ({ roomCode }) => {
      currentRoomCode = roomCode;
      document.getElementById('setupMenu').style.display = 'none';
      const inviteUrl = `${window.location.origin}?room=${roomCode}`;
      document.getElementById('inviteLinkInput').value = inviteUrl;
      document.getElementById('qrCodeImg').src = `https://quickchart.io/qr?text=${encodeURIComponent(inviteUrl)}&size=200`;
      document.getElementById('inviteSection').style.display = 'block';
      log(`Sala ${roomCode} creada. Agregá bots o compartí el link.`);
    });

    socket.on('room:joined', ({ roomCode }) => {
      currentRoomCode = roomCode;
      document.getElementById('setupMenu').style.display = 'none';
      log(`Te uniste a la sala ${roomCode}. Esperando a los demás...`);
    });

    socket.on('room:player_update', ({ count, players }) => {
      document.getElementById('playerCountText').innerText = `Jugadores en sala: ${count}/4`;
      log(`Jugadores en la sala (${count}/4): ${players.map(p => p.name).join(', ')}`);
      enemyPlayers = players.filter(p => p.id !== socket.id);
    });

    socket.on('room:start_placement', () => {
      document.getElementById('inviteSection').style.display = 'none';
      document.getElementById('placementPanel').style.display = 'block';
      document.getElementById('boardContainer').style.display = 'block';
      renderShipSelector();
      renderSetupBoard();
    });

    function renderShipSelector() {
      const container = document.getElementById('shipSelector');
      container.innerHTML = '';

      availableShips.forEach(s => {
        const isPlaced = placedShips.some(p => p.id === s.id);
        const isSelected = selectedSetupShipId === s.id;
        const div = document.createElement('div');
        div.className = `draggable-ship ${isPlaced ? 'placed' : ''} ${isSelected ? 'selected' : ''}`;
        div.innerText = `${s.name} (${s.length})`;

        div.onclick = () => {
          if (!isPlaced) {
            selectedSetupShipId = s.id;
            renderShipSelector();
          }
        };
        container.appendChild(div);
      });

      document.getElementById('btnConfirmFleet').disabled = (placedShips.length < availableShips.length);
    }

    function tryPlaceShipManual(r, c) {
      if (!selectedSetupShipId) return alert('Seleccioná un barco de la lista primero');
      const shipCfg = availableShips.find(s => s.id === selectedSetupShipId);
      if (!shipCfg) return;

      const coords = [];
      for (let i = 0; i < shipCfg.length; i++) {
        const currR = isHorizontal ? r : r + i;
        const currC = isHorizontal ? c + i : c;

        if (currR >= 10 || currC >= 10 || myGrid[currR][currC] !== null) {
          return alert('Posición no válida');
        }
        coords.push({ r: currR, c: currC });
      }

      coords.forEach(coord => { myGrid[coord.r][coord.c] = shipCfg.id; });
      placedShips.push({ ...shipCfg, coords, isHorizontal });
      selectedSetupShipId = null;

      renderShipSelector();
      renderSetupBoard();
    }

    function ubicarBarcosAleatorios() {
      resetPlacement();
      availableShips.forEach(s => {
        let placed = false;
        while (!placed) {
          const r = Math.floor(Math.random() * 10);
          const c = Math.floor(Math.random() * 10);
          const orient = Math.random() < 0.5;

          let canPlace = true;
          let coords = [];
          for (let i = 0; i < s.length; i++) {
            let currR = orient ? r : r + i;
            let currC = orient ? c + i : c;
            if (currR >= 10 || currC >= 10 || myGrid[currR][currC] !== null) {
              canPlace = false; break;
            }
            coords.push({ r: currR, c: currC });
          }

          if (canPlace) {
            coords.forEach(coord => { myGrid[coord.r][coord.c] = s.id; });
            placedShips.push({ ...s, coords, isHorizontal: orient });
            placed = true;
          }
        }
      });
      renderShipSelector();
      renderSetupBoard();
    }

    function resetPlacement() {
      placedShips = [];
      myGrid = Array(10).fill(null).map(() => Array(10).fill(null));
      selectedSetupShipId = null;
      renderShipSelector();
      renderSetupBoard();
    }

    function renderSetupBoard() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 10; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';

          if (myGrid[r][c] !== null) {
            cell.classList.add('ship');
          }

          cell.onclick = () => tryPlaceShipManual(r, c);
          grid.appendChild(cell);
        }
      }
      renderShipsOverlay();
    }

    function confirmarFlota() {
      if (placedShips.length < availableShips.length) return;

      document.getElementById('placementPanel').style.display = 'none';
      log('✅ Flota lista (8 barcos). Esperando que los demás confirmen...');

      socket.emit('player:confirm_fleet', { roomCode: currentRoomCode, grid: myGrid, ships: placedShips });
    }

    socket.on('game:start', ({ activePlayer }) => {
      document.getElementById('placementPanel').style.display = 'none';
      document.getElementById('skillsPanel').style.display = 'flex';
      document.getElementById('tauntContainer').style.display = 'flex';
      document.getElementById('tabBar').style.display = 'flex';

      actualizarTurno(activePlayer);
    });

    function mostrarCartelTemporal(esMiTurno) {
      if (turnPopupTimer) clearTimeout(turnPopupTimer);

      const popup = document.getElementById('turnPopup');
      const img = document.getElementById('turnPopupImg');
      
      img.src = esMiTurno ? 'assets/turno.png' : 'assets/turnorival.png';
      popup.classList.add('show');

      turnPopupTimer = setTimeout(() => {
        popup.classList.remove('show');
      }, 1400);
    }

    function actualizarTurno(activePlayer) {
      activePlayerObj = activePlayer;
      myTurn = (activePlayer.id === socket.id);
      
      const btnRoulette = document.getElementById('btnRoulette');

      mostrarCartelTemporal(myTurn);

      if (myTurn) {
        btnRoulette.classList.add('pulse-roulette');
        btnRoulette.disabled = rouletteSpun;
        log(`✨ <b>¡ES TU TURNO!</b> Girá la ruleta.`);
      } else {
        btnRoulette.classList.remove('pulse-roulette');
        btnRoulette.disabled = true;
        log(`⏳ Turno de <b>${activePlayer.name}</b>.`);
      }

      updateTauntInputState();
      renderTabs();
      renderActiveBoard();
    }

    socket.on('game:turn_changed', ({ activePlayer }) => {
      rouletteSpun = false;
      currentTargetId = undefined;
      isFreeChoice = false;
      document.getElementById('targetInfo').innerText = '🎯 Objetivo: Pendiente';
      actualizarTurno(activePlayer);
    });

    function girarRuleta() {
      if (!myTurn || rouletteSpun) return alert('No es tu turno de girar la ruleta');
      socket.emit('game:spin_roulette', { roomCode: currentRoomCode });
    }

    socket.on('game:roulette_result', ({ targetId, isFreeChoice: free, targetName }) => {
      rouletteSpun = true;
      const btnRoulette = document.getElementById('btnRoulette');
      btnRoulette.disabled = true;
      btnRoulette.classList.remove('pulse-roulette');

      if (free) {
        isFreeChoice = true;
        document.getElementById('targetInfo').innerText = '🎯 Objetivo: ¡LIBRE!';
        log('🎰 ¡La ruleta cayó libre! Podés disparar a cualquier rival o usar defensas en tu flota.');
      } else {
        currentTargetId = targetId;
        document.getElementById('targetInfo').innerText = `🎯 Objetivo: ${targetName}`;
        log(`🎰 Objetivo asignado: <b>${targetName}</b>`);
      }

      renderTabs();
    });

    socket.on('game:sync_board', ({ boardHistories: updatedHistories, activePlayerEnergy }) => {
      boardHistories = updatedHistories;
      if (myTurn && activePlayerEnergy !== undefined) {
        myEnergy = activePlayerEnergy;
        document.getElementById('energyValue').innerText = myEnergy;
      }
      renderActiveBoard();
    });

    function setSkill(skill) {
      selectedSkill = skill;
      shipToMove = null;
      document.querySelectorAll('.skill-btn').forEach(b => b.classList.remove('active'));
      const map = {
        basic_shot: 'btnShot', cross_shot: 'btnCross', sonar: 'btnSonar', rain: 'btnRain',
        shield: 'btnShield', move_ship: 'btnMove', repair: 'btnRepair'
      };
      if (map[skill]) document.getElementById(map[skill]).classList.add('active');
      log(`Habilidad seleccionada: <b>${skill.toUpperCase()}</b>`);
      renderActiveBoard();
    }

    function renderTabs() {
      const tabBar = document.getElementById('tabBar');
      tabBar.innerHTML = '';

      const myBtn = document.createElement('button');
      myBtn.className = 'tab-btn' + (activeTabId === 'my' ? ' active' : '');
      myBtn.innerText = `🛡️ Mi Flota ${showMyShips ? '👁️' : '🙈'}`;
      myBtn.onclick = () => {
        if (activeTabId === 'my') toggleShowShips();
        else { activeTabId = 'my'; renderTabs(); renderActiveBoard(); }
      };
      tabBar.appendChild(myBtn);

      enemyPlayers.forEach(p => {
        if (!boardHistories[p.id]) boardHistories[p.id] = {};
        const isLockedTarget = myTurn && rouletteSpun && (isFreeChoice || currentTargetId === p.id);

        const btn = document.createElement('button');
        btn.className = 'tab-btn' + (activeTabId === p.id ? ' active' : '') + (isLockedTarget ? ' target-locked' : '');
        btn.dataset.playerId = p.id;
        btn.innerText = `${p.name} ${isLockedTarget ? '🎯' : ''}`;
        btn.onclick = () => { activeTabId = p.id; renderTabs(); renderActiveBoard(); };
        tabBar.appendChild(btn);
      });
    }

    function renderShipsOverlay() {
      const shipsLayer = document.getElementById('shipsLayer');
      shipsLayer.innerHTML = '';

      if (activeTabId !== 'my' || !showMyShips) return;

      placedShips.forEach(ship => {
        if (!ship.coords || ship.coords.length === 0) return;

        const firstCoord = ship.coords[0];
        const isHoriz = ship.isHorizontal !== undefined 
          ? ship.isHorizontal 
          : (ship.coords.length === 1 || ship.coords[0].r === ship.coords[1]?.r);

        const shipEl = document.createElement('div');
        shipEl.className = 'rendered-ship-entity';
        if (selectedSkill === 'move_ship' && myTurn && rouletteSpun) {
          shipEl.classList.add('draggable-ship-game');
          shipEl.draggable = true;

          shipEl.ondragstart = (e) => {
            if (estaBarcoDanado(ship.id)) {
              e.preventDefault();
              return alert('⚠️ Este barco está dañado (💥). ¡Debés repararlo antes de moverlo!');
            }
            e.dataTransfer.setData('text/plain', ship.id);
            shipEl.classList.add('dragging');
          };

          shipEl.ondragend = () => {
            shipEl.classList.remove('dragging');
          };
        }

        shipEl.style.backgroundImage = `url('${ship.img}')`;

        const topPos = firstCoord.r * 10;
        const leftPos = firstCoord.c * 10;

        if (isHoriz) {
          shipEl.style.left = leftPos + '%';
          shipEl.style.top = topPos + '%';
          shipEl.style.width = (ship.length * 10) + '%';
          shipEl.style.height = '10%';
          shipEl.style.transform = 'none';
        } else {
          shipEl.style.left = leftPos + '%';
          shipEl.style.top = topPos + '%';
          shipEl.style.width = (ship.length * 10) + '%';
          shipEl.style.height = '10%';
          shipEl.style.transformOrigin = '0% 0%';
          shipEl.style.transform = 'rotate(90deg) translateY(-100%)';
        }

        shipsLayer.appendChild(shipEl);
      });
    }

    function renderActiveBoard() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      if (!boardHistories[activeTabId]) boardHistories[activeTabId] = {};

      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 10; c++) {
          const key = `${r}_${c}`;
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.row = r;
          cell.dataset.col = c;

          if (activeTabId === 'my') {
            const shipId = myGrid[r][c];
            if (showMyShips && shipId !== null) {
              cell.classList.add('ship');
            }

            const state = boardHistories[socket.id] ? boardHistories[socket.id][key] : null;
            if (state) {
              cell.classList.add(state);
              if (state === 'shielded') cell.classList.add('shielded');
            }

            cell.ondragover = (e) => {
              e.preventDefault();
              cell.classList.add('drag-over');
            };

            cell.ondragleave = () => {
              cell.classList.remove('drag-over');
            };

            cell.ondrop = (e) => {
              e.preventDefault();
              cell.classList.remove('drag-over');
              const draggedShipId = e.dataTransfer.getData('text/plain');
              if (draggedShipId) {
                ejecutarMoverBarcoDrop(draggedShipId, r, c);
              }
            };

            cell.onclick = () => ejecutarAccionPropia(r, c, shipId);
          } else {
            const state = boardHistories[activeTabId][key];
            if (state) {
              if (state !== 'shielded') {
                cell.classList.add(state);
                if (state === 'sonar') cell.innerText = '📡';
              }
            }
            cell.onclick = (e) => dispararRivalConMisil(r, c, e.currentTarget);
          }

          grid.appendChild(cell);
        }
      }

      renderShipsOverlay();
    }

    /* ANIMACIÓN DE MISIL ÚNICO */
    function lanzarUnMisil(targetCell, onHitCallback) {
      const W = 38, H = 95;
      const rect = targetCell.getBoundingClientRect();
      const endX = rect.left + rect.width / 2 - W / 2;
      const endY = rect.top + rect.height / 2 - H / 2;

      const startY = Math.max(-H, endY - 380);
      const dy = startY - endY;
      const dx = (endX + 140 > window.innerWidth - W) ? -140 : 140;

      const travelDeg = Math.atan2(-dx, dy) * 180 / Math.PI;
      const rot = travelDeg - MISSILE_NOSE_DEG;

      const missile = document.createElement('div');
      missile.className = 'missile-projectile';
      missile.style.left = endX + 'px';
      missile.style.top = endY + 'px';

      const img = new Image();
      img.alt = '';
      img.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block;';
      img.onerror = () => {
        missile.innerHTML = '🚀';
        missile.style.fontSize = '44px';
      };
      img.src = MISSILE_SRC;
      missile.appendChild(img);
      document.body.appendChild(missile);

      let terminado = false;
      const terminar = () => {
        if (terminado) return;
        terminado = true;
        missile.remove();

        const fx = document.createElement('div');
        fx.className = 'impact-fx';
        fx.style.left = (rect.left + rect.width / 2 - 28) + 'px';
        fx.style.top = (rect.top + rect.height / 2 - 28) + 'px';
        document.body.appendChild(fx);

        fx.animate([
          { transform: 'scale(0.2)', opacity: 1 },
          { transform: 'scale(1.6)', opacity: 0 }
        ], { duration: 350, easing: 'ease-out' }).onfinish = () => fx.remove();

        if (onHitCallback) onHitCallback();
      };

      const anim = missile.animate([
        { transform: `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(1.4)`, opacity: 0 },
        { transform: `translate(${dx * 0.85}px, ${dy * 0.85}px) rotate(${rot}deg) scale(1.2)`, opacity: 1 },
        { transform: `translate(0px, 0px) rotate(${rot}deg) scale(1)`, opacity: 1 }
      ], { duration: 800, easing: 'cubic-bezier(0.4, 0, 0.9, 0.6)', fill: 'forwards' });

      anim.onfinish = terminar;
      setTimeout(terminar, 1200);
    }

    /* ANIMACIÓN COMPLETA (SOPORTA 8 MISILES EN RÁFAGA PARA LLUVIA) */
    function animarMisil(targetCell, callback) {
      document.getElementById('turnPopup').classList.remove('show');

      if (selectedSkill === 'rain') {
        const gridCells = Array.from(document.querySelectorAll('#grid .cell'));
        if (gridCells.length === 0) return callback();

        const shuffled = [...gridCells].sort(() => 0.5 - Math.random());
        const target8 = shuffled.slice(0, 8);

        let completados = 0;
        target8.forEach((cell, index) => {
          setTimeout(() => {
            lanzarUnMisil(cell, () => {
              completados++;
              if (completados === target8.length) {
                if (callback) callback();
              }
            });
          }, index * 120);
        });
      } else {
        lanzarUnMisil(targetCell, callback);
      }
    }

    function estaBarcoDanado(shipId) {
      const shipObj = placedShips.find(p => p.id === shipId);
      if (!shipObj) return false;
      return shipObj.coords.some(c => {
        const key = `${c.r}_${c.c}`;
        return boardHistories[socket.id] && boardHistories[socket.id][key] === 'hit';
      });
    }

    function ejecutarMoverBarcoDrop(shipId, newR, newC) {
      if (!myTurn) return alert('¡Esperá tu turno!');
      if (!rouletteSpun) return alert('¡Primero girá la ruleta!');
      if (!isFreeChoice) return alert('Mover barco requiere Objetivo Libre en la Ruleta');
      if (myEnergy < 2) return alert('⚡ Energía insuficiente (2⚡)');

      const shipObj = placedShips.find(s => s.id === shipId);
      if (!shipObj) return;

      if (estaBarcoDanado(shipId)) {
        return alert('⚠️ Este barco está dañado (💥). ¡Debés repararlo antes de moverlo!');
      }

      const isHoriz = shipObj.coords.length > 1 ? shipObj.coords[0].r === shipObj.coords[1].r : true;
      const tempGrid = myGrid.map(row => [...row]);
      shipObj.coords.forEach(c => { tempGrid[c.r][c.c] = null; });

      const newCoords = [];
      for (let i = 0; i < shipObj.length; i++) {
        const currR = isHoriz ? newR : newR + i;
        const currC = isHoriz ? newC + i : newC;

        if (currR >= 10 || currC >= 10 || tempGrid[currR][currC] !== null) {
          return alert('❌ El barco no entra en esa ubicación o choca con otro.');
        }
        newCoords.push({ r: currR, c: currC });
      }

      shipObj.coords.forEach(c => { myGrid[c.r][c.c] = null; });
      newCoords.forEach(c => { myGrid[c.r][c.c] = shipId; });
      shipObj.coords = newCoords;

      socket.emit('game:action', {
        roomCode: currentRoomCode,
        targetId: socket.id,
        row: newR,
        col: newC,
        type: 'move_ship',
        cost: 2,
        moveData: { shipId, newR, newC }
      });

      setSkill('basic_shot');
      renderActiveBoard();
    }

    function ejecutarAccionPropia(r, c, shipId) {
      if (!myTurn) return alert('¡Esperá tu turno!');
      if (!rouletteSpun) return alert('¡Primero girá la ruleta!');

      if (['basic_shot', 'cross_shot', 'rain', 'sonar'].includes(selectedSkill)) {
        return alert('❌ No podés disparar sobre tu propia flota.');
      }

      const costs = { shield: 2, repair: 3, move_ship: 2 };
      const cost = costs[selectedSkill] || 0;

      if (myEnergy < cost) return alert('⚡ Energía insuficiente');

      if (selectedSkill === 'shield') {
        socket.emit('game:action', {
          roomCode: currentRoomCode,
          targetId: socket.id,
          row: r,
          col: c,
          type: 'shield',
          cost
        });
        setSkill('basic_shot');
      } 
      else if (selectedSkill === 'repair') {
        const key = `${r}_${c}`;
        if (!boardHistories[socket.id] || boardHistories[socket.id][key] !== 'hit') {
          return alert('⚠️ Solo podés reparar casillas con un impacto (💥)');
        }
        socket.emit('game:action', {
          roomCode: currentRoomCode,
          targetId: socket.id,
          row: r,
          col: c,
          type: 'repair',
          cost
        });
        setSkill('basic_shot');
      } 
      else if (selectedSkill === 'move_ship') {
        log(`💡 Arrastrá el barco directamente con el mouse a su nueva casilla.`);
      }
    }

    function dispararRivalConMisil(r, c, cellElem) {
      if (disparoEnCurso) return;
      if (!myTurn) return alert('¡Esperá tu turno para disparar!');
      if (!rouletteSpun) return alert('¡Primero girá la ruleta!');

      if (!isFreeChoice && activeTabId !== currentTargetId) {
        return alert(`¡Pestaña bloqueada! Tenés que dispararle a tu objetivo de la ruleta.`);
      }

      const costs = { basic_shot: 0, cross_shot: 4, sonar: 2, rain: 6 };
      const cost = costs[selectedSkill] || 0;

      if (myEnergy < cost) return alert('⚡ Energía insuficiente');

      disparoEnCurso = true;
      animarMisil(cellElem, () => {
        socket.emit('game:action', {
          roomCode: currentRoomCode,
          targetId: activeTabId,
          row: r,
          col: c,
          type: selectedSkill,
          cost
        });
        disparoEnCurso = false;
        setSkill('basic_shot');
      });
    }

    function copiarLink() {
      const copyText = document.getElementById('inviteLinkInput');
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert('¡Link de invitación copiado!');
    }

    function updateTauntInputState() {
      const tauntInput = document.getElementById('tauntInput');
      const btnSend = document.getElementById('btnSendTaunt');
      if (tauntInput && btnSend) {
        tauntInput.disabled = myTurn;
        btnSend.disabled = myTurn;
        tauntInput.placeholder = myTurn ? 'Concentrate en tu turno...' : 'Chicana corta (máx 40)...';
      }
    }

    // ==========================================
    // 🏆 MANEJADOR DE FIN DE JUEGO
    // ==========================================

    socket.on('game:over', ({ winnerName, winnerId }) => {
      document.getElementById('turnPopup').classList.remove('show');
      const modal = document.getElementById('winnerModal');
      const img = document.getElementById('endGameImg');
      
      const esGanador = (winnerId === socket.id);
      const srcImagen = esGanador ? 'assets/winner.png' : 'assets/loser.png';

      img.onerror = () => {
        if (img.src.endsWith('.png')) {
          img.src = esGanador ? 'assets/winner.jpg' : 'assets/loser.jpg';
          return;
        }

        img.style.display = 'none';
        let textOverlay = document.getElementById('endGameTextFallback');
        if (!textOverlay) {
          textOverlay = document.createElement('h1');
          textOverlay.id = 'endGameTextFallback';
          textOverlay.style.cssText = 'font-size: 36px; font-weight: bold; margin-bottom: 20px; text-shadow: 0 0 12px rgba(255,255,255,0.6); text-align: center;';
          modal.insertBefore(textOverlay, modal.firstChild);
        }
        textOverlay.style.color = esGanador ? '#22c55e' : '#ef4444';
        textOverlay.innerText = esGanador ? '🏆 ¡ERES EL DUEÑO DEL MAR! 🏆' : '💀 DERROTA 💀';
      };

      img.style.display = 'block';
      img.src = srcImagen;
      modal.style.display = 'flex';
    });

    // ==========================================
    // 🔊 SISTEMA DE CHICANAS POR VOZ (TAUNTS)
    // ==========================================

    let availableVoices = [];
    let audioUnlocked = false;

    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      availableVoices = window.speechSynthesis.getVoices();
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function unlockMobileAudio() {
      if (audioUnlocked || !('speechSynthesis' in window)) return;
      const dummyUtterance = new SpeechSynthesisUtterance('');
      dummyUtterance.volume = 0;
      window.speechSynthesis.speak(dummyUtterance);
      audioUnlocked = true;
    }

    document.addEventListener('touchstart', unlockMobileAudio, { once: true });
    document.addEventListener('click', unlockMobileAudio, { once: true });

    function speakTaunt(text, gender = 'male', mode = 'es') {
      if (!('speechSynthesis' in window)) return;

      unlockMobileAudio();
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      const targetLang = (mode === 'repo') ? 'en-US' : 'es-AR';
      
      utterance.lang = targetLang;
      utterance.pitch = (gender === 'male') ? 0.7 : 1.3;
      utterance.rate = 0.95;

      const voices = availableVoices.length > 0 ? availableVoices : window.speechSynthesis.getVoices();
      const matchedVoice = voices.find(v => {
        const isLangMatch = v.lang.toLowerCase().includes(targetLang.split('-')[0]);
        const nameLower = v.name.toLowerCase();
        const isGenderMatch = (gender === 'female') 
          ? (nameLower.includes('female') || nameLower.includes('zira') || nameLower.includes('sabina') || nameLower.includes('monica'))
          : (nameLower.includes('male') || nameLower.includes('david') || nameLower.includes('pablo') || nameLower.includes('diego'));
        return isLangMatch && isGenderMatch;
      }) || voices.find(v => v.lang.toLowerCase().includes(targetLang.split('-')[0]));

      if (matchedVoice) utterance.voice = matchedVoice;

      window.speechSynthesis.speak(utterance);
    }

    function sendTaunt() {
      if (myTurn) {
        log('⚠️ Solo podés chicanear durante el turno del rival.');
        return;
      }

      if (activeTabId === 'my') {
        alert('⚠️ Seleccioná en las pestañas al rival que le querés mandar la chicana.');
        return;
      }

      const input = document.getElementById('tauntInput');
      const text = input ? input.value.trim() : '';

      if (text.length === 0) return;

      const gender = document.getElementById('tauntGender')?.value || 'male';
      const mode = document.getElementById('tauntMode')?.value || 'es';

      unlockMobileAudio();

      socket.emit('taunt:send', { text, targetId: activeTabId, gender, mode });
      input.value = '';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const tauntInput = document.getElementById('tauntInput');
      if (tauntInput) {
        tauntInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            sendTaunt();
          }
        });
      }
    });

    socket.on('taunt:receive', ({ senderId, text, gender, mode }) => {
      log(`🗣️ <b>Chicana recibida:</b> "${text}"`);
      speakTaunt(text, gender, mode);

      const playerTab = document.querySelector(`[data-player-id="${senderId}"]`);
      if (playerTab) {
        const originalText = playerTab.innerText;
        playerTab.innerText = `🔊 ${originalText}`;
        setTimeout(() => {
          playerTab.innerText = originalText;
        }, 3000);
      }
    });
  </script>
